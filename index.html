<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>考研英语二核心词</title>
<style>
:root{
  --bg:#f4f6f3;--card:#fff;--ink:#17201d;--muted:#66736e;--line:#dde4df;
  --brand:#0f766e;--brand-soft:#e5f4f1;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --s:#b42318;--s-soft:#fee4e2;--a:#b45309;--a-soft:#fff2df;
  --b:#0f766e;--b-soft:#e5f4f1;--c:#59636f;--c-soft:#edf0f2;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 14px 36px rgba(20,40,32,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#101513;--card:#19201d;--ink:#e9efeb;--muted:#94a39c;--line:#2a3530;
    --brand:#55d6c9;--brand-soft:#14332f;--ok:#68d391;--warn:#f1b25b;--bad:#f87171;
    --s:#ff8a80;--s-soft:#3b1d1c;--a:#f1b25b;--a-soft:#3b2b16;
    --b:#55d6c9;--b-soft:#14332f;--c:#b2bcc6;--c-soft:#252d33;
    --shadow:0 1px 3px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.24)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100dvh;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);z-index:10;flex-shrink:0}
.brand{font-weight:800;color:var(--brand);font-size:15px;white-space:nowrap}
.spacer{flex:1}
.tabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.tab.active{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.tab.active{color:#0b1714}}
main{flex:1;min-height:0;width:100%;max-width:760px;margin:0 auto;padding:12px 14px 10px;display:flex}
.view{display:flex;flex-direction:column;gap:10px;width:100%;min-height:0;flex:1}
.hidden{display:none!important}
.study-head{display:flex;align-items:center;gap:8px;flex-shrink:0}
.position{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.position b{color:var(--ink);font-size:15px}
.meaning-toggle{margin-left:auto;border:1px solid color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--card);
  color:var(--brand);font:inherit;font-size:13px;font-weight:750;border-radius:999px;padding:7px 12px;cursor:pointer;min-width:90px}
.meaning-toggle[aria-pressed="true"]{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.meaning-toggle[aria-pressed="true"]{color:#0b1714}}
.progress{height:5px;border-radius:999px;background:var(--line);overflow:hidden;flex-shrink:0}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.card{position:relative;flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:12px;overflow:hidden;touch-action:none;user-select:none}
.card::after{content:"";position:absolute;inset:auto -25% -45% -25%;height:60%;background:radial-gradient(circle,var(--brand-soft),transparent 68%);opacity:.65;pointer-events:none}
.card>*{position:relative;z-index:1}
.priority{font-size:15px;font-weight:800;border-radius:999px;padding:7px 13px;line-height:1;letter-spacing:.02em}
.priority.s{color:var(--s);background:var(--s-soft)}
.priority.a{color:var(--a);background:var(--a-soft)}
.priority.b{color:var(--b);background:var(--b-soft)}
.priority.c{color:var(--c);background:var(--c-soft)}
.word{font-size:clamp(40px,11vw,64px);line-height:1.05;font-weight:800;letter-spacing:-.025em;word-break:break-word;max-width:100%}
.rule{height:1px;width:min(210px,70%);background:var(--line)}
.meaning{font-size:clamp(23px,6.5vw,32px);line-height:1.35;font-weight:650;max-width:30ch;min-height:1.35em}
.meaning-placeholder{font-size:14px;color:var(--muted);font-weight:400}
.swipe-hint{margin-top:auto;font-size:11.5px;color:var(--muted);padding-top:12px}
.nav-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex-shrink:0}
.nav-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;border-radius:12px;padding:9px 10px;cursor:pointer}
.nav-btn:disabled{opacity:.35;cursor:default}
.word-id{font-size:11.5px;color:var(--muted);white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex-shrink:0}
.btn{border:0;border-radius:14px;padding:13px 8px;font:inherit;font-size:15px;font-weight:750;color:#fff;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.bad{background:var(--bad)}.btn.mid{background:var(--warn)}.btn.good{background:var(--ok)}
.empty{min-height:50vh;align-items:center;justify-content:center;text-align:center;color:var(--muted);background:var(--card);
  border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:10px}
.empty strong{color:var(--ink);font-size:21px}
.list-head{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none}
.search:focus{border-color:var(--brand)}
.filters{display:flex;gap:5px;overflow:auto}
.filter{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer}
.filter.active{background:var(--brand);border-color:var(--brand);color:#fff}
.list-wrap{flex:1;min-height:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;-webkit-overflow-scrolling:touch}
.word-list{list-style:none;margin:0;padding:0}
.word-list li{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.word-list li:last-child{border-bottom:0}
.list-no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.list-word{font-weight:750;font-size:15px}
.list-meaning{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-priority{font-size:11px;font-weight:800;border-radius:999px;padding:4px 7px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 7px;text-align:center}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:12px}
.panel-title{font-size:13px;color:var(--muted)}
.daily{display:flex;gap:7px;flex-wrap:wrap}
.daily button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.daily button.active{color:var(--brand);border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.note{font-size:12.5px;line-height:1.7;color:var(--muted)}
.note b{color:var(--ink)}
.danger{border:1px solid color-mix(in srgb,var(--bad) 38%,var(--line));background:transparent;color:var(--bad);border-radius:12px;padding:10px;font:inherit;font-size:13px;cursor:pointer}
@media (max-width:430px){.brand{font-size:14px}.card{padding:15px 13px}.meaning-toggle{font-size:12px}}
@media (max-height:620px){
  header{padding:6px 10px}main{padding:6px 10px 7px}.view{gap:6px}
  .card{padding:9px 12px;gap:5px}.word{font-size:clamp(30px,8vh,44px)}
  .meaning{font-size:clamp(18px,5vh,24px)}.rule{margin:0}.swipe-hint{display:none}
  .nav-btn{padding:6px 8px}.actions .btn{padding:9px 6px;font-size:14px}
}
</style>
</head>
<body>
<header>
  <span class="brand">英语二核心词</span><span class="spacer"></span>
  <div class="tabs">
    <button class="tab active" id="tabStudy">学习</button>
    <button class="tab" id="tabList">词表</button>
    <button class="tab" id="tabStat">统计</button>
  </div>
</header>
<main>
  <section class="view" id="viewStudy">
    <div class="study-head">
      <div class="position" id="position">第 <b>1</b> / 1 个</div>
      <button class="meaning-toggle" id="meaningToggle" aria-pressed="false">显示释义</button>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <article class="card" id="card">
      <span class="priority b" id="priorityBadge">B 次重点</span>
      <div class="word" id="word">加载中</div>
      <div class="rule"></div>
      <div class="meaning" id="meaning"></div>
      <div class="swipe-hint">上滑下一个 · 下滑上一个</div>
    </article>
    <div class="nav-row">
      <button class="nav-btn" id="prevWord">← 上一个</button>
      <span class="word-id" id="wordId">优先级 #1</span>
      <button class="nav-btn" id="nextWord">下一个 →</button>
    </div>
    <div class="actions">
      <button class="btn bad" data-level="0">不认识</button>
      <button class="btn mid" data-level="1">模糊</button>
      <button class="btn good" data-level="2">认识</button>
    </div>
    <div class="empty hidden" id="done">
      <strong>今日任务完成</strong>
      <span>上下滑动只切换单词，不会自动评分。</span>
    </div>
  </section>

  <section class="view hidden" id="viewList">
    <div class="list-head">
      <input class="search" id="searchInput" type="search" placeholder="搜索单词或中文释义">
      <div class="filters" id="filters">
        <button class="filter active" data-priority="all">全部</button>
        <button class="filter" data-priority="S">S</button>
        <button class="filter" data-priority="A">A</button>
        <button class="filter" data-priority="B">B</button>
      </div>
    </div>
    <div class="list-wrap"><ol class="word-list" id="wordList"></ol></div>
  </section>

  <section class="view hidden" id="viewStat">
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>总词数</span></div>
      <div class="stat"><b id="sLearned">0</b><span>学过</span></div>
      <div class="stat"><b id="sMastered">0</b><span>掌握</span></div>
      <div class="stat"><b id="sDue">0</b><span>待复习</span></div>
    </div>
    <div class="panel">
      <div class="panel-title">每天新词数</div>
      <div class="daily" id="dailyOpts"></div>
    </div>
    <div class="panel">
      <div class="panel-title">背诵优先级</div>
      <div class="note">
        <b>S 必背</b> → <b>A 重点</b> → <b>B 次重点</b><br>
        系统已综合英语二（主）、英语一（低权重）、词书分层和五书共识，按优先级从高到低排好。你不需要自己再看次数、覆盖套数和频段。
      </div>
    </div>
    <div class="panel"><button class="danger" id="resetAll">清空全部学习记录</button></div>
  </section>
</main>

const DATA_META = {"papers":[2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024],"paper_count":15,"count_unit":"occurrence","coverage_unit":"paper","source":"2010-2024 考研英语二真题 PDF","note":"count 为去除题型说明后的原始词次；coverage 为出现该词的真题套数。","generated_at":"2026-10-27","selection_total":1342,"selection_bands":{"中频核心":613,"高频核心":204,"跨词书核心":207,"真题补充":318},"exam_weights":{"english_2":1.0,"english_1":0.35,"english_3":0.0},"english_1":{"papers":[2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024],"paper_count":15,"count_unit":"occurrence","coverage_unit":"paper","source":"2010-2024 考研英语一真题 PDF","note":"count 为去除题型说明、写作提示和翻译提示后的原始词次；coverage 为出现该词的真题套数。统计正文、题干和选项。"},"source_files":[{"exam":"english_2","name":"2010-2021年考研英语二真题合集.pdf","sha256":"33e5b6959ce9ace554c42b8533d9d35a10a5e8e7c2e92c49dfef4ae7335fbd92"},{"exam":"english_2","name":"2022年考研英语二真题.pdf","sha256":"41d072d4ba147aae7a011578f665c754e2352de06d563515bad98524f029f49d"},{"exam":"english_2","name":"2023年考研英语二真题.pdf","sha256":"ffa6cd2577d310db34697b7bac17af4ffc71397b649967e065ca4cd23751a4b9"},{"exam":"english_2","name":"2024年考研英语二真题.pdf","sha256":"f6965607c58f5db3d13a2fcdd26bf87b3956d29816ef200635a4d7a27e41ac60"}]};
const LS_STATE = 'ky_words_v1';
const LS_CONF = 'ky_conf_v1';
const INTERVALS = [0, 1, 3, 7, 15, 30];
const DAY = 864e5;
const load = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
const save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };
const todayTs = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const $ = id => document.getElementById(id);
let state = load(LS_STATE, {});
let conf = Object.assign({ daily: 30, showMeaning: false }, load(LS_CONF, {}));
let queue = [];
let idx = 0;
let priorityFilter = 'all';
let searchText = '';

function priorityClass(priority) {
  return (priority || 'C').charAt(0).toLowerCase();
}
function setPriority(el, priority) {
  el.className = 'priority ' + priorityClass(priority);
  el.textContent = priority || 'C 补充';
}
function buildQueue() {
  const now = todayTs();
  const due = [], fresh = [];
  for (const word of WORDS) {
    const record = state[word.word];
    if (!record) fresh.push(word);
    else if (record.due <= now) due.push(word);
  }
  due.sort((a,b) => a.id - b.id);
  fresh.sort((a,b) => a.id - b.id);
  queue = due.concat(fresh.slice(0, conf.daily));
  idx = 0;
}
function renderStudy() {
  const total = queue.length;
  const current = total ? Math.min(idx + 1, total) : 0;
  $('position').innerHTML = `第 <b>${current}</b> / ${total} 个`;
  $('progressBar').style.width = total ? (Math.min(idx, total) / total * 100) + '%' : '100%';
  if (!total || idx >= total) {
    $('card').classList.add('hidden');
    document.querySelector('.nav-row').classList.add('hidden');
    document.querySelector('.actions').classList.add('hidden');
    $('done').classList.remove('hidden');
    $('meaningToggle').classList.add('hidden');
    return;
  }
  $('card').classList.remove('hidden');
  document.querySelector('.nav-row').classList.remove('hidden');
  document.querySelector('.actions').classList.remove('hidden');
  $('done').classList.add('hidden');
  $('meaningToggle').classList.remove('hidden');
  const word = queue[idx];
  $('word').textContent = word.word;
  setPriority($('priorityBadge'), word.priority);
  $('wordId').textContent = '优先级 #' + word.priority_rank;
  const meaning = $('meaning');
  if (conf.showMeaning) {
    meaning.className = 'meaning';
    meaning.textContent = word.meaning || '（暂无释义）';
  } else {
    meaning.className = 'meaning meaning-placeholder';
    meaning.textContent = '点击“显示释义”查看中文';
  }
  $('meaningToggle').textContent = conf.showMeaning ? '隐藏释义' : '显示释义';
  $('meaningToggle').setAttribute('aria-pressed', String(!!conf.showMeaning));
  $('prevWord').disabled = idx <= 0;
  $('nextWord').disabled = idx >= total - 1;
}
function navigate(delta) {
  if (!queue.length || idx >= queue.length) return;
  const next = idx + delta;
  if (next < 0 || next >= queue.length) return;
  idx = next;
  renderStudy();
}
function toggleMeaning() {
  conf.showMeaning = !conf.showMeaning;
  save(LS_CONF, conf);
  renderStudy();
}
function rate(level) {
  const word = queue[idx];
  if (!word) return;
  const prev = state[word.word] || { lv: 0, seen: 0, due: 0 };
  let nextLv;
  if (level === 0) nextLv = 0;
  else if (level === 1) nextLv = Math.max(1, prev.lv || 0);
  else nextLv = Math.min(INTERVALS.length - 1, (prev.lv || 0) + 1);
  const gap = INTERVALS[nextLv];
  state[word.word] = { lv: nextLv, due: todayTs() + Math.max(gap, nextLv === 0 ? 0 : 1) * DAY, seen: (prev.seen || 0) + 1 };
  save(LS_STATE, state);
  idx += 1;
  renderStudy();
  updateStats();
}
function updateStats() {
  const now = todayTs();
  let learned = 0, mastered = 0, due = 0;
  for (const word of WORDS) {
    const record = state[word.word];
    if (!record) continue;
    learned += 1;
    if (record.lv >= 4) mastered += 1;
    if (record.due <= now) due += 1;
  }
  $('sTotal').textContent = WORDS.length;
  $('sLearned').textContent = learned;
  $('sMastered').textContent = mastered;
  $('sDue').textContent = due;
}
function renderList() {
  const list = $('wordList');
  const q = searchText.trim().toLowerCase();
  const fragment = document.createDocumentFragment();
  for (const word of WORDS) {
    const p = (word.priority || 'C').charAt(0);
    if (priorityFilter !== 'all' && p !== priorityFilter) continue;
    if (q && !word.word.includes(q) && !word.meaning.toLowerCase().includes(q)) continue;
    const li = document.createElement('li');
    const no = document.createElement('span'); no.className = 'list-no'; no.textContent = '#' + word.id;
    const main = document.createElement('div');
    const w = document.createElement('div'); w.className = 'list-word'; w.textContent = word.word;
    const m = document.createElement('div'); m.className = 'list-meaning'; m.textContent = word.meaning;
    main.append(w, m);
    const badge = document.createElement('span'); badge.className = 'list-priority priority ' + priorityClass(word.priority); badge.textContent = word.priority;
    li.append(no, main, badge);
    fragment.append(li);
  }
  list.replaceChildren(fragment);
}
function switchView(name) {
  for (const v of ['Study','List','Stat']) $('view' + v).classList.toggle('hidden', v !== name);
  document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.id === 'tab' + name));
  if (name === 'List') renderList();
  if (name === 'Stat') updateStats();
}
function renderDailyOpts() {
  const box = $('dailyOpts');
  box.replaceChildren();
  for (const n of [15, 30, 50, 100]) {
    const b = document.createElement('button');
    b.textContent = n + ' 个';
    b.classList.toggle('active', conf.daily === n);
    b.onclick = () => { conf.daily = n; save(LS_CONF, conf); renderDailyOpts(); buildQueue(); renderStudy(); };
    box.append(b);
  }
}
let touchStart = null;
const card = $('card');
card.addEventListener('touchstart', event => {
  if (event.touches.length !== 1) return;
  const t = event.touches[0];
  touchStart = { x: t.clientX, y: t.clientY, time: Date.now(), moved: false };
}, { passive: true });
card.addEventListener('touchmove', event => {
  if (!touchStart || event.touches.length !== 1) return;
  const t = event.touches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) touchStart.moved = true;
  if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx) * 1.15) event.preventDefault();
}, { passive: false });
card.addEventListener('touchend', event => {
  if (!touchStart || event.changedTouches.length !== 1) { touchStart = null; return; }
  const t = event.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  const elapsed = Date.now() - touchStart.time;
  const moved = touchStart.moved;
  touchStart = null;
  if (!moved && elapsed < 450) { toggleMeaning(); return; }
  if (elapsed > 850 || Math.abs(dy) < 58 || Math.abs(dy) < Math.abs(dx) * 1.15) return;
  navigate(dy < 0 ? 1 : -1);
}, { passive: true });
card.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });
$('meaningToggle').onclick = toggleMeaning;
$('prevWord').onclick = () => navigate(-1);
$('nextWord').onclick = () => navigate(1);
document.querySelectorAll('.actions .btn').forEach(button => { button.onclick = () => rate(Number(button.dataset.level)); });
$('tabStudy').onclick = () => switchView('Study');
$('tabList').onclick = () => switchView('List');
$('tabStat').onclick = () => switchView('Stat');
$('searchInput').oninput = event => { searchText = event.target.value; renderList(); };
document.querySelectorAll('.filter').forEach(button => {
  button.onclick = () => {
    priorityFilter = button.dataset.priority;
    document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b === button));
    renderList();
  };
});
$('resetAll').onclick = () => {
  if (!confirm('确定清空全部学习记录？此操作不可恢复。')) return;
  state = {};
  save(LS_STATE, state);
  buildQueue();
  renderStudy();
  updateStats();
};
window.addEventListener('keydown', event => {
  if (event.repeat) return;
  const active = document.activeElement;
  if (active && (['INPUT','TEXTAREA','SELECT'].includes(active.tagName) || active.isContentEditable)) return;
  if ($('viewStudy').classList.contains('hidden')) return;
  if (event.code === 'Space') { event.preventDefault(); toggleMeaning(); return; }
  if (event.key === 'ArrowUp') { event.preventDefault(); navigate(-1); return; }
  if (event.key === 'ArrowDown') { event.preventDefault(); navigate(1); return; }
  if (['1','2','3'].includes(event.key)) rate(Number(event.key) - 1);
});
buildQueue();
renderStudy();
updateStats();
renderDailyOpts();
</script>
