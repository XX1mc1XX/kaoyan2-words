name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.9"
  NODE_VERSION: "22.23.3"
  TERSER_VERSION: "5.51.2"
  WRANGLER_VERSION: "4.152.0"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 共享 runner 冷启动显著慢于开发机；本地默认预算仍是 800ms。
  KY_PERF_BUDGET_MS: "2500"

jobs:
  windows-smoke:
    name: Windows build and smoke tests
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt 2>&1 | Tee-Object -FilePath ci-artifacts/pip-install.log
          exit $LASTEXITCODE

      - name: Install Node dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org 2>&1 | Tee-Object -FilePath ci-artifacts/npm-ci.log
          exit $LASTEXITCODE

      - name: Verify pinned toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = @()
          $pythonActual = (& python --version 2>&1).Trim() -replace '^Python\s+', ''
          $nodeActual = (& node --version 2>&1).Trim().TrimStart('v')
          $terserActual = (& node_modules/.bin/terser.cmd --version 2>&1).Trim() -replace '^terser\s+', ''
          $wranglerOutput = (& node_modules/.bin/wrangler.cmd --version 2>&1) -join "`n"
          $wranglerMatch = [regex]::Match($wranglerOutput, '\d+\.\d+\.\d+')
          $wranglerActual = $wranglerMatch.Value
          $lines += "python=$pythonActual (expected $env:PYTHON_VERSION)"
          $lines += "node=$nodeActual (expected $env:NODE_VERSION)"
          $lines += "terser=$terserActual (expected $env:TERSER_VERSION)"
          $lines += "wrangler=$wranglerActual (expected $env:WRANGLER_VERSION)"
          $lines | Tee-Object -FilePath ci-artifacts/toolchain.log
          if ($pythonActual -ne $env:PYTHON_VERSION -or
              $nodeActual -ne $env:NODE_VERSION -or
              $terserActual -ne $env:TERSER_VERSION -or
              $wranglerActual -ne $env:WRANGLER_VERSION) {
            throw "Pinned toolchain verification failed"
          }

      - name: Verify Microsoft Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path -LiteralPath $edge)) {
            throw "Microsoft Edge not found at $edge"
          }
          "KY_EDGE=$edge" | Tee-Object -FilePath ci-artifacts/edge.log -Append
          "KY_EDGE=$edge" >> $env:GITHUB_ENV

      - name: Verify tracked data pipeline
        shell: pwsh
        run: |
          python -m unittest -v scripts.tools.test_core 2>&1 | Tee-Object -FilePath ci-artifacts/data-tests.log
          exit $LASTEXITCODE

      - name: Build HTML
        shell: pwsh
        env:
          npm_config_offline: "true"
        run: |
          python scripts/make_html.py 2>&1 | Tee-Object -FilePath ci-artifacts/make_html.log
          exit $LASTEXITCODE

      - name: Run regression tests
        shell: pwsh
        run: |
          python scripts/tools/run_tests.py 2>&1 | Tee-Object -FilePath ci-artifacts/run_tests.log
          exit $LASTEXITCODE

      - name: Run offline check
        shell: pwsh
        run: |
          python scripts/tools/offline_check.py --json 2>&1 | Tee-Object -FilePath ci-artifacts/offline_check.log
          exit $LASTEXITCODE

      - name: Measure first-screen performance
        shell: pwsh
        run: |
          python scripts/tools/measure_perf.py --json 2>&1 | Tee-Object -FilePath ci-artifacts/measure_perf.log
          exit $LASTEXITCODE

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 7
